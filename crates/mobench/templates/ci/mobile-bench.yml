name: Mobile Benchmarks

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Exact 40-character PR head SHA"
        required: true
        type: string
      pr_number:
        description: "PR number; required unless allow_non_pr is true"
        required: false
        type: string
        default: ""
      platform:
        description: "android | ios | both"
        required: false
        type: choice
        default: both
        options: [android, ios, both]
      crate_path:
        description: "Path to the benchmark crate"
        required: true
        type: string
      functions:
        description: "Shared JSON array or comma-separated function list"
        required: true
        type: string
      functions_ios:
        description: "Optional iOS functions; defaults to functions"
        required: false
        type: string
        default: ""
      functions_android:
        description: "Optional Android functions; defaults to functions"
        required: false
        type: string
        default: ""
      prepare_script:
        description: "Optional repository-relative preparation script"
        required: false
        type: string
        default: ""
      ios_devices:
        description: "Optional JSON array of iOS device objects"
        required: false
        type: string
        default: ""
      android_devices:
        description: "Optional JSON array of Android device objects"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write

jobs:
  benchmark:
    uses: worldcoin/mobile-bench-rs/.github/workflows/reusable-bench.yml@1ac54adaf2bd97c6ca303705e1e0471257716f48
    with:
      head_sha: ${{ inputs.head_sha }}
      pr_number: ${{ inputs.pr_number }}
      allow_non_pr: false
      platform: ${{ inputs.platform }}
      crate_path: ${{ inputs.crate_path }}
      functions: ${{ inputs.functions }}
      functions_ios: ${{ inputs.functions_ios }}
      functions_android: ${{ inputs.functions_android }}
      prepare_script: ${{ inputs.prepare_script }}
      ios_devices: ${{ inputs.ios_devices }}
      android_devices: ${{ inputs.android_devices }}
      iterations: "30"
      warmup: "5"
      device_profile: low-spec
      rust_toolchain: stable
      ffi_backend: ""
      mobench_version: "0.1.47"
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
