[package]
name = "mobench-process"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors = ["Dominik Clemente - dcbuilder.eth <dc@world.org>"]
description = "Declared executable and subprocess provenance primitives for mobench"
repository = "https://github.com/worldcoin/mobile-bench-rs"
documentation = "https://docs.rs/mobench-process"
keywords = ["benchmark", "process", "provenance", "performance"]
categories = ["development-tools::profiling", "os"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
