name: Mobile Bench Plot Fixtures

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plot-fixtures:
    name: Plot fixture ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [basic, ffi]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install matplotlib
        run: python -m pip install --upgrade pip matplotlib

      - name: Build local mobench binaries
        run: cargo build -p mobench --bins --locked

      - name: Add local mobench binaries to PATH
        run: echo "${GITHUB_WORKSPACE}/target/debug" >> "$GITHUB_PATH"

      - name: Render and verify plot fixtures
        run: scripts/ci/verify-example-plot-fixture.sh ${{ matrix.fixture }}

      - name: Upload plot artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: mobench-plot-${{ matrix.fixture }}
          path: target/mobench/plot-fixtures/${{ matrix.fixture }}
          if-no-files-found: error
