name: Mobile Bench Plot Fixtures

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plot-fixtures:
    name: Plot fixture ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [basic, ffi]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install matplotlib
        run: python -m pip install --upgrade pip matplotlib

      - name: Build local mobench binaries
        run: cargo build -p mobench --bins --locked

      - name: Add local mobench binaries to PATH
        run: echo "${GITHUB_WORKSPACE}/target/debug" >> "$GITHUB_PATH"

      - name: Render and verify plot fixtures
        run: mobench fixture verify-plots ${{ matrix.fixture }}

      - name: Upload plot artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobench-plot-${{ matrix.fixture }}
          path: target/mobench/plot-fixtures/${{ matrix.fixture }}
          if-no-files-found: error
