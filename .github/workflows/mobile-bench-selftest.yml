name: Mobile Bench Self-Test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        type: choice
        default: both
        options:
          - android
          - ios
          - both
      iterations:
        description: "Number of benchmark iterations"
        type: string
        default: "5"
      warmup:
        description: "Number of warmup iterations"
        type: string
        default: "1"
      ios_device:
        description: "BrowserStack iOS device name"
        type: string
        default: "iPhone 14"
      ios_os_version:
        description: "BrowserStack iOS OS version"
        type: string
        default: "16"
      android_device:
        description: "BrowserStack Android device name"
        type: string
        default: "Google Pixel 7"
      android_os_version:
        description: "BrowserStack Android OS version"
        type: string
        default: "13.0"
      mobench_version:
        description: "Mobench version to install from crates.io when mobench_ref is unset"
        type: string
        default: ""
      mobench_ref:
        description: "Git ref for mobile-bench-rs to install instead of the in-repo path"
        type: string
        default: ""

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  selftest:
    uses: ./.github/workflows/reusable-bench.yml
    with:
      crate_path: crates/sample-fns
      functions: '["sample_fns::fibonacci"]'
      platform: ${{ inputs.platform }}
      iterations: ${{ inputs.iterations }}
      warmup: ${{ inputs.warmup }}
      device_profile: custom
      ios_device: ${{ inputs.ios_device }}
      ios_os_version: ${{ inputs.ios_os_version }}
      android_device: ${{ inputs.android_device }}
      android_os_version: ${{ inputs.android_os_version }}
      build_release: true
      mobench_version: ${{ inputs.mobench_version }}
      mobench_ref: ${{ inputs.mobench_ref }}
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
