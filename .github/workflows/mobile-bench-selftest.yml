name: Mobile Bench Self-Test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        type: choice
        default: both
        options:
          - android
          - ios
          - both
      iterations:
        description: "Number of benchmark iterations"
        type: string
        default: "5"
      warmup:
        description: "Number of warmup iterations"
        type: string
        default: "1"
      mobench_version:
        description: "Mobench version to install from crates.io when mobench_ref is unset"
        type: string
        default: ""
      mobench_ref:
        description: "Git ref for mobile-bench-rs to install instead of the in-repo path"
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write

jobs:
  selftest:
    uses: ./.github/workflows/reusable-bench.yml
    with:
      crate_path: examples/ffi-benchmark
      functions: '["ffi_benchmark::bench_fibonacci"]'
      functions_ios: '["ffi_benchmark::bench_fibonacci"]'
      functions_android: '["ffi_benchmark::bench_fibonacci"]'
      platform: ${{ inputs.platform }}
      iterations: ${{ inputs.iterations }}
      warmup: ${{ inputs.warmup }}
      device_profile: low-spec
      ios_devices: '[{"device":"iPhone 14","os_version":"16"}]'
      android_devices: '[{"device":"Google Pixel 7","os_version":"13.0"}]'
      build_release: true
      rust_toolchain: nightly-2026-03-04
      ffi_backend: native-c-abi
      mobench_version: ${{ inputs.mobench_version }}
      mobench_ref: ${{ inputs.mobench_ref }}
      head_sha: ${{ github.sha }}
      allow_non_pr: true
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
