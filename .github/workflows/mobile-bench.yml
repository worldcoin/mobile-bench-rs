name: Mobile Bench

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android | ios | both"
        required: false
        type: choice
        default: both
        options:
          - android
          - ios
          - both
      device_profile:
        description: "BrowserStack device profile"
        required: false
        type: string
        default: "low-spec"
      crate_path:
        description: "Benchmark crate fixture path"
        required: false
        type: string
        default: "examples/ffi-benchmark"
      functions:
        description: "Comma-separated benchmark functions"
        required: false
        type: string
        default: "ffi_benchmark::bench_fibonacci,ffi_benchmark::bench_checksum"
      compatibility_json:
        description: "Optional JSON object with functions_ios, functions_android, prepare_script, ios_devices, and android_devices"
        required: false
        type: string
        default: "{}"
      iterations:
        description: "Number of benchmark iterations"
        required: false
        type: string
        default: "50"
      warmup:
        description: "Number of warmup iterations"
        required: false
        type: string
        default: "5"
      pr_number:
        description: "PR number for sticky comment publishing"
        required: true
        type: string
      head_sha:
        description: "Exact commit SHA to benchmark"
        required: true
        type: string
      requested_by:
        description: "Who triggered the run"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: mobench-${{ inputs.pr_number != '' && inputs.pr_number || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Example fixture benchmark
    if: inputs.requested_by != 'browserstack-recovery'
    uses: ./.github/workflows/reusable-bench.yml
    with:
      crate_path: ${{ inputs.crate_path }}
      functions: ${{ inputs.functions }}
      functions_ios: ${{ fromJSON(inputs.compatibility_json).functions_ios || '' }}
      functions_android: ${{ fromJSON(inputs.compatibility_json).functions_android || '' }}
      prepare_script: ${{ fromJSON(inputs.compatibility_json).prepare_script || '' }}
      ios_devices: ${{ fromJSON(inputs.compatibility_json).ios_devices || '' }}
      android_devices: ${{ fromJSON(inputs.compatibility_json).android_devices || '' }}
      platform: ${{ inputs.platform }}
      device_profile: ${{ inputs.device_profile }}
      iterations: ${{ inputs.iterations }}
      warmup: ${{ inputs.warmup }}
      build_release: true
      pr_number: ${{ inputs.pr_number }}
      requested_by: ${{ inputs.requested_by }}
      head_sha: ${{ inputs.head_sha }}
      check_run_name: "Mobench Fixtures"
      regression_threshold_pct: "1000.0"
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      MOBENCH_APP_PRIVATE_KEY: ${{ secrets.MOBENCH_APP_PRIVATE_KEY }}
      MOBENCH_APP_ID: ${{ secrets.MOBENCH_APP_ID }}

  # Compatibility bridge for diagnosing existing BrowserStack builds before the
  # dedicated recovery workflow lands on the default branch. In this mode the
  # existing head_sha input carries the BrowserStack build ID, not a Git SHA.
  recover-browserstack:
    name: Recover ${{ inputs.platform }} build ${{ inputs.head_sha }}
    if: inputs.requested_by == 'browserstack-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: browserstack
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: Validate recovery request
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          BUILD_ID: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" != "android" && "$PLATFORM" != "ios" ]]; then
            echo "recovery platform must be android or ios" >&2
            exit 2
          fi
          if ! [[ "$BUILD_ID" =~ ^[a-f0-9]{40}$ ]]; then
            echo "head_sha must carry a 40-character lowercase hexadecimal BrowserStack build ID" >&2
            exit 2
          fi

      - name: Checkout recovery implementation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache Cargo inputs
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-browserstack-recover-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-browserstack-recover-

      - name: Build Mobench recovery CLI
        run: cargo build --locked --release -p mobench --bin mobench

      - name: Resume and fetch existing build
        env:
          PLATFORM: ${{ inputs.platform }}
          BUILD_ID: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          target/release/mobench fetch \
            --target "$PLATFORM" \
            --build-id "$BUILD_ID" \
            --output-dir target/browserstack-recovery \
            --wait \
            --poll-interval-secs 5 \
            --timeout-secs 900

      - name: Upload recovered evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: browserstack-${{ inputs.platform }}-${{ inputs.head_sha }}
          path: target/browserstack-recovery/${{ inputs.head_sha }}/
          if-no-files-found: warn
          retention-days: 14
