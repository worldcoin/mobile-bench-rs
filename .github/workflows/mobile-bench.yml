name: Mobile Bench

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  provekit-pr451:
    name: ProveKit PR 451 passport age check
    uses: ./.github/workflows/provekit-pr451-browserstack.yml
    secrets: inherit
    with:
      crate_path: ./bench-mobile
      functions: '["bench_mobile::bench_passport_complete_age_check_prove"]'
      functions_ios: '["bench_mobile::bench_passport_complete_age_check_prove"]'
      functions_android: '["bench_mobile::bench_passport_complete_age_check_prove"]'
      platform: both
      device_profile: smoke
      iterations: "1"
      warmup: "0"
      mobench_ref: 53f37ec80b9e35fdd2f947e2691b8260f218853b
      head_sha: bb36bc058eceafc44ddee1477c0fc5833b6402b3
      requested_by: codex-manual-validation
