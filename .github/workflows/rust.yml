name: Rust

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Dependency policy
        run: cargo deny check advisories bans licenses sources

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      - name: Public API compatibility
        run: |
          cargo semver-checks check-release --package mobench-sdk --baseline-version 0.1.35
          cargo semver-checks check-release --package mobench --baseline-version 0.1.35

      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --locked --all-features --no-deps

      - name: Test
        run: cargo test --workspace --locked

      - name: Workflow trust-boundary regression tests
        run: python3 tests/workflow_security_test.py

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint security-sensitive workflows
        run: >-
          "$(go env GOPATH)/bin/actionlint" -color
          -ignore 'maximum number of inputs for "workflow_dispatch"'
          .github/workflows/reusable-bench.yml
          .github/workflows/mobile-bench-publish-plots.yml
          .github/workflows/mobile-bench.yml
          .github/workflows/mobile-bench-selftest.yml
          .github/workflows/reusable-pr-command.yml
          .github/workflows/rust.yml

      - name: Host benchmark smoke
        run: cargo bench -p mobench --features bench-support --bench host_contracts -- --test

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch'
        run: |
          cargo publish --dry-run -p mobench-macros
          cargo publish --dry-run -p mobench-sdk
          cargo publish --dry-run -p mobench
