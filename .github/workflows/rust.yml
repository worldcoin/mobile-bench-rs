name: Rust

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@afc483d62172accfff644fa56e82b4dab50727fc # cargo-deny
        with:
          tool: cargo-deny

      - name: Dependency policy
        run: cargo deny check advisories bans licenses sources

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@77f7de69a88565bdcf254b89775fc9b4d7e6e1d2 # cargo-semver-checks
        with:
          tool: cargo-semver-checks

      - name: Public API compatibility
        run: |
          cargo semver-checks check-release --package mobench-sdk --baseline-version 0.1.35
          cargo semver-checks check-release --package mobench --baseline-version 0.1.35

      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --locked --all-features --no-deps

      - name: Test
        run: cargo test --workspace --locked

      - name: Host benchmark smoke
        run: cargo bench -p mobench --features bench-support --bench host_contracts -- --test

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mobench") | .version')"
          if cargo info "mobench@${version}" >/dev/null 2>&1; then
            echo "mobench ${version} is already published; package the complete workspace without registry-collision verification"
            cargo package --workspace --locked --no-verify \
              --exclude sample-fns --exclude basic-benchmark --exclude ffi-benchmark
          else
            cargo package --workspace --locked --keep-going \
              --exclude sample-fns --exclude basic-benchmark --exclude ffi-benchmark
          fi
