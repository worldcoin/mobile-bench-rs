name: Rust

on:
  pull_request:
  push:
    branches:
      - main
      - dev

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Dependency policy
        run: cargo deny check advisories bans licenses sources

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      - name: Public API compatibility
        run: |
          cargo semver-checks check-release --package mobench-sdk --baseline-version 0.1.35
          cargo semver-checks check-release --package mobench --baseline-version 0.1.35

      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

      - name: Test
        run: cargo test --workspace

      - name: Host benchmark smoke
        run: cargo bench -p mobench --features bench-support --bench host_contracts -- --test

      - name: Publish dry run
        run: |
          cargo publish --dry-run -p mobench-macros
          cargo publish --dry-run -p mobench-sdk
          cargo publish --dry-run -p mobench
