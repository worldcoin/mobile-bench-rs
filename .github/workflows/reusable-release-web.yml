name: Reusable Downstream WASM Release Gate

on:
  workflow_call:
    inputs:
      mobench_sha:
        description: "Exact mobench release-candidate commit"
        required: true
        type: string
      provekit_sha:
        description: "Exact ProveKit v1 fixture commit"
        required: true
        type: string
      world_id_sha:
        description: "Exact world-id-protocol fixture commit"
        required: true
        type: string
      iterations:
        required: false
        type: string
        default: "2"
      warmup:
        required: false
        type: string
        default: "1"
    secrets:
      BROWSERSTACK_USERNAME:
        required: true
      BROWSERSTACK_ACCESS_KEY:
        required: true

permissions: {}

jobs:
  validate:
    name: Validate pinned release inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable SHAs and sample counts
        shell: bash
        env:
          MOBENCH_SHA: ${{ inputs.mobench_sha }}
          PROVEKIT_SHA: ${{ inputs.provekit_sha }}
          WORLD_ID_SHA: ${{ inputs.world_id_sha }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
        run: |
          set -euo pipefail
          for value in "$MOBENCH_SHA" "$PROVEKIT_SHA" "$WORLD_ID_SHA"; do
            [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]] || {
              echo "::error::release inputs must use full commit SHAs"
              exit 2
            }
          done
          [[ "$ITERATIONS" =~ ^[1-9][0-9]?$ ]] || exit 2
          [[ "$WARMUP" =~ ^[0-9]$ ]] || exit 2

  trusted-cli:
    name: Build release-candidate web control plane
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact mobench candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: worldcoin/mobile-bench-rs
          ref: ${{ inputs.mobench_sha }}
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Build candidate cargo-mobench
        run: |
          set -euo pipefail
          cargo build --locked --release -p mobench --bin cargo-mobench
          (
            cd target/release
            sha256sum cargo-mobench > cargo-mobench.sha256
          )
      - name: Upload candidate cargo-mobench
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-web-cargo-mobench
          path: |
            target/release/cargo-mobench
            target/release/cargo-mobench.sha256
          if-no-files-found: error
          retention-days: 1

  prepare:
    name: Prepare ${{ matrix.project }} WASM bundle
    needs: [validate, trusted-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: provekit
            repository: worldfnd/provekit
            ref: ${{ inputs.provekit_sha }}
            crate_path: bench-mobile
            toolchain: nightly-2026-03-04
            adapter: tests/release-fixtures/prepare-provekit-wasm.sh
          - project: world-id-protocol
            repository: worldcoin/world-id-protocol
            ref: ${{ inputs.world_id_sha }}
            crate_path: crates/zk-mobile-bench
            toolchain: 1.93.0
            adapter: tests/release-fixtures/prepare-world-id-wasm.sh
    steps:
      - name: Checkout exact mobench candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: worldcoin/mobile-bench-rs
          ref: ${{ inputs.mobench_sha }}
          persist-credentials: false
          path: mobench
      - name: Checkout exact downstream fixture
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          persist-credentials: false
          path: downstream
      - name: Setup downstream Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            mobench
            downstream
          shared-key: release-web-${{ matrix.project }}
      - name: Adapt pinned downstream fixture for browser execution
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: bash "mobench/${ADAPTER}" downstream mobench
      - name: Install downstream-matched wasm-bindgen CLI
        env:
          CRATE_PATH: ${{ matrix.crate_path }}
        run: |
          set -euo pipefail
          metadata="$(
            cargo metadata \
              --manifest-path "downstream/${CRATE_PATH}/Cargo.toml" \
              --format-version 1
          )"
          version="$(
            python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          packages = {package["id"]: package for package in metadata["packages"]}
          sdk = next(
              package for package in metadata["packages"]
              if package["name"] == "mobench-sdk"
              and "/mobench/crates/mobench-sdk" in package["manifest_path"]
          )
          node = next(node for node in metadata["resolve"]["nodes"] if node["id"] == sdk["id"])
          dependency = next(dep for dep in node["deps"] if dep["name"] == "wasm_bindgen")
          print(packages[dependency["pkg"]]["version"])
          ' <<<"$metadata"
          )"
          cargo install wasm-bindgen-cli \
            --version "$version" \
            --locked \
            --root "$RUNNER_TEMP/wasm-bindgen"
          echo "$RUNNER_TEMP/wasm-bindgen/bin" >> "$GITHUB_PATH"
      - name: Download candidate cargo-mobench
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-cargo-mobench
          path: trusted-bin
      - name: Build release WASM bundle
        env:
          CRATE_PATH: ${{ matrix.crate_path }}
        run: |
          set -euo pipefail
          (
            cd trusted-bin
            sha256sum --check cargo-mobench.sha256
          )
          chmod +x trusted-bin/cargo-mobench
          trusted-bin/cargo-mobench build \
            --target web \
            --crate-path "downstream/${CRATE_PATH}" \
            --release \
            --output-dir "$PWD/release-output"
      - name: Enumerate and hash release WASM bundle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("release-output/web")
          expected = {
              "index.html",
              "runner.js",
              "worker.js",
              "mobench_web.js",
              "mobench_web_bg.wasm",
              "mobench-web.json",
          }
          files = set()
          entries = []
          for path in root.rglob("*"):
              if path.is_symlink():
                  raise SystemExit(f"release bundle contains symlink: {path}")
              if not path.is_file():
                  continue
              relative = path.relative_to(root).as_posix()
              files.add(relative)
              contents = path.read_bytes()
              entries.append({
                  "path": relative,
                  "size": len(contents),
                  "sha256": hashlib.sha256(contents).hexdigest(),
              })
          if files != expected:
              raise SystemExit(
                  f"release bundle files differ: missing={expected-files}, extra={files-expected}"
              )
          manifest = {
              "schema": "mobench.release-web-artifact.v1",
              "entries": sorted(entries, key=lambda entry: entry["path"]),
          }
          (root / "release-artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          PY
      - name: Upload immutable WASM bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-web-${{ matrix.project }}
          path: release-output/web
          if-no-files-found: error
          retention-days: 1

  prepare-provekit-npm:
    name: Prepare ProveKit npm browser bundle
    needs: [validate, trusted-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact mobench candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: worldcoin/mobile-bench-rs
          ref: ${{ inputs.mobench_sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Verify pinned public fixture assets
        working-directory: tests/release-fixtures/provekit-npm-web
        run: |
          set -euo pipefail
          echo "1fa4f2b74e405653d77e635864f91650656b112eba30655e06dc1127dd0f7566  public/artifacts/oprf_taceo.pkp" | sha256sum --check --status
          echo "18f31e1f91652967d59872f846f6d1540e96a8ee8b99ac0cc53d172eb311a1ba  public/artifacts/oprf_taceo.pkv" | sha256sum --check --status
          echo "3bb7a7ab32da798341c1d7c5152d4d91bf2ddad4416673c78f6993f07f750259  public/artifacts/inputs.json" | sha256sum --check --status
      - name: Build pinned ProveKit npm browser fixture
        working-directory: tests/release-fixtures/provekit-npm-web
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
      - name: Enumerate and hash immutable npm bundle
        working-directory: tests/release-fixtures/provekit-npm-web
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("dist")
          if not (root / "index.html").is_file():
              raise SystemExit("npm release bundle is missing index.html")
          entries = []
          for path in root.rglob("*"):
              if path.is_symlink():
                  raise SystemExit(f"npm release bundle contains symlink: {path}")
              if not path.is_file():
                  continue
              contents = path.read_bytes()
              entries.append({
                  "path": path.relative_to(root).as_posix(),
                  "size": len(contents),
                  "sha256": hashlib.sha256(contents).hexdigest(),
              })
          if not entries:
              raise SystemExit("npm release bundle has no files")
          (root / "release-artifact-manifest.json").write_text(json.dumps({
              "schema": "mobench.release-web-artifact.v1",
              "entries": sorted(entries, key=lambda entry: entry["path"]),
          }, indent=2) + "\n")
          PY
      - name: Upload immutable ProveKit npm bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-web-provekit-npm
          path: tests/release-fixtures/provekit-npm-web/dist
          if-no-files-found: error
          retention-days: 1

  browser:
    name: ${{ matrix.project }} WASM on ${{ matrix.environment }}
    needs: [trusted-cli, prepare, prepare-provekit-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: browserstack
    permissions:
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        project: [provekit, world-id-protocol, provekit-npm]
        environment: [macOS Safari, Windows Chrome, iOS Safari, Android Chrome]
        include:
          - environment: macOS Safari
            browser: Safari
            browser_version: latest
            os: OS X
            os_version: Sequoia
            device: ""
          - environment: Windows Chrome
            browser: Chrome
            browser_version: latest
            os: Windows
            os_version: "11"
            device: ""
          - environment: iOS Safari
            browser: Safari
            browser_version: ""
            os: ""
            os_version: "18"
            device: iPhone 16 Pro Max
          - environment: Android Chrome
            browser: Chrome
            browser_version: ""
            os: ""
            os_version: "13.0"
            device: Google Pixel 7
    steps:
      - name: Download candidate cargo-mobench
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-cargo-mobench
          path: trusted-bin
      - name: Download downstream WASM bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-${{ matrix.project }}
          path: bundle
      - name: Verify immutable candidate and WASM bundle
        shell: bash
        run: |
          set -euo pipefail
          (
            cd trusted-bin
            sha256sum --check cargo-mobench.sha256
          )
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path, PurePosixPath

          root = Path("bundle")
          manifest_path = root / "release-artifact-manifest.json"
          if manifest_path.is_symlink() or not manifest_path.is_file():
              raise SystemExit("release artifact manifest is missing or unsafe")
          manifest = json.loads(manifest_path.read_text())
          if manifest.get("schema") != "mobench.release-web-artifact.v1":
              raise SystemExit("unexpected release artifact manifest schema")
          entries = manifest.get("entries")
          if not isinstance(entries, list) or not entries:
              raise SystemExit("release artifact manifest has no entries")
          expected = set()
          for entry in entries:
              if set(entry) != {"path", "size", "sha256"}:
                  raise SystemExit("release artifact entry has unexpected fields")
              raw_path = entry["path"]
              relative = PurePosixPath(raw_path)
              if (
                  not isinstance(raw_path, str)
                  or not raw_path
                  or "\\" in raw_path
                  or relative.is_absolute()
                  or relative.as_posix() != raw_path
                  or any(part in ("", ".", "..") for part in relative.parts)
              ):
                  raise SystemExit(f"unsafe release artifact path: {relative}")
              path = root.joinpath(*relative.parts)
              parent = path.parent
              while parent != root:
                  if parent.is_symlink() or not parent.is_dir():
                      raise SystemExit(f"unsafe release artifact parent: {relative}")
                  parent = parent.parent
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"release artifact is missing or unsafe: {relative}")
              contents = path.read_bytes()
              if len(contents) != entry["size"]:
                  raise SystemExit(f"release artifact size mismatch: {relative}")
              if hashlib.sha256(contents).hexdigest() != entry["sha256"]:
                  raise SystemExit(f"release artifact hash mismatch: {relative}")
              expected.add(str(relative))
          observed = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file() and path != manifest_path
          }
          if observed != expected:
              raise SystemExit(
                  f"release artifact set mismatch: missing={expected-observed}, "
                  f"extra={observed-expected}"
              )
          PY
      - name: Start local static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory bundle \
            > "$RUNNER_TEMP/mobench-web-server.log" 2>&1 &
          echo "MOBENCH_WEB_SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Configure BrowserStack credentials
        uses: browserstack/github-actions/setup-env@93aebce225b754566349151c0676b26b005e591b
        with:
          username: ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      - name: Start BrowserStack Local
        uses: browserstack/github-actions/setup-local@93aebce225b754566349151c0676b26b005e591b
        with:
          local-testing: start
          local-logging-level: all-logs
          local-identifier: random
          local-args: --force-local
      - name: Run downstream browser benchmark
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          BROWSER: ${{ matrix.browser }}
          BROWSER_VERSION: ${{ matrix.browser_version }}
          TARGET_OS: ${{ matrix.os }}
          OS_VERSION: ${{ matrix.os_version }}
          DEVICE: ${{ matrix.device }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
          PROVEKIT_FUNCTION: bench_mobile::bench_passport_complete_age_check_prove
          PROVEKIT_NPM_FUNCTION: provekit_npm::oprf_taceo_prove_and_verify
          WORLD_ID_FUNCTION: zk_mobile_bench::bench_nullifier_proving_only
        run: |
          set -euo pipefail
          chmod +x trusted-bin/cargo-mobench
          function_name="$WORLD_ID_FUNCTION"
          [ "$PROJECT" != provekit ] || function_name="$PROVEKIT_FUNCTION"
          [ "$PROJECT" != provekit-npm ] || function_name="$PROVEKIT_NPM_FUNCTION"
          args=(
            run-web
            --url http://127.0.0.1:4173/
            --function "$function_name"
            --iterations "$ITERATIONS"
            --warmup "$WARMUP"
            --browser "$BROWSER"
            --os-version "$OS_VERSION"
            --local-identifier "$BROWSERSTACK_LOCAL_IDENTIFIER"
            --script-timeout-secs 3600
            --page-load-timeout-secs 300
            --build-name "mobench release gate ${{ inputs.mobench_sha }}"
            --session-name "$PROJECT ${{ matrix.environment }}"
            --output "results/${PROJECT}.json"
          )
          [ -z "$BROWSER_VERSION" ] || args+=(--browser-version "$BROWSER_VERSION")
          [ -z "$TARGET_OS" ] || args+=(--os "$TARGET_OS")
          [ -z "$DEVICE" ] || args+=(--device "$DEVICE")
          trusted-bin/cargo-mobench "${args[@]}"
      - name: Stop BrowserStack Local
        if: always()
        uses: browserstack/github-actions/setup-local@93aebce225b754566349151c0676b26b005e591b
        with:
          local-testing: stop
      - name: Stop local static server
        if: always()
        shell: bash
        run: |
          if [ -n "${MOBENCH_WEB_SERVER_PID:-}" ]; then
            kill "$MOBENCH_WEB_SERVER_PID" 2>/dev/null || true
          fi
      - name: Upload browser result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-web-result-${{ matrix.project }}-${{ matrix.environment }}
          path: |
            results/*.json
            ${{ runner.temp }}/mobench-web-server.log
          if-no-files-found: warn

  complete:
    name: Downstream WASM release gate
    needs: [prepare, prepare-provekit-npm, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every WASM lane
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PREPARE_NPM_RESULT: ${{ needs.prepare-provekit-npm.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$PREPARE_NPM_RESULT" = success
          test "$BROWSER_RESULT" = success
