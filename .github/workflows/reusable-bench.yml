name: Reusable Mobile Benchmark (BrowserStack)

on:
  workflow_call:
    inputs:
      crate_path:
        description: "Path to the benchmark crate in the caller repo"
        required: true
        type: string
      functions:
        description: "JSON array or comma-separated benchmark function names"
        required: true
        type: string
      iterations:
        description: "Number of benchmark iterations"
        required: false
        type: string
        default: "30"
      warmup:
        description: "Number of warmup iterations"
        required: false
        type: string
        default: "5"
      platform:
        description: "Target platform: android, ios, or both"
        required: false
        type: string
        default: both
      device_profile:
        description: "Device profile: low-spec, mid-spec, high-spec, custom"
        required: false
        type: string
        default: low-spec
      ios_device:
        description: "Custom iOS device name"
        required: false
        type: string
        default: ""
      ios_os_version:
        description: "Custom iOS OS version"
        required: false
        type: string
        default: ""
      android_device:
        description: "Custom Android device name"
        required: false
        type: string
        default: ""
      android_os_version:
        description: "Custom Android OS version"
        required: false
        type: string
        default: ""
      rust_targets_ios:
        description: "Comma-separated iOS Rust targets"
        required: false
        type: string
        default: aarch64-apple-ios,aarch64-apple-ios-sim
      rust_targets_android:
        description: "Comma-separated Android Rust targets"
        required: false
        type: string
        default: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      build_release:
        description: "Build in release mode"
        required: false
        type: boolean
        default: true
      mobench_version:
        description: "Mobench version used only in the untrusted prepare jobs"
        required: false
        type: string
        default: ""
      mobench_ref:
        description: "Mobench git ref used only in the untrusted prepare jobs"
        required: false
        type: string
        default: ""
      ffi_backend:
        description: "mobench FFI backend to configure in caller/mobench.toml"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR number for current-head validation and reporting"
        required: false
        type: string
        default: ""
      requested_by:
        description: "Who triggered the run"
        required: false
        type: string
        default: ""
      check_run_name:
        description: "GitHub Check Run name"
        required: false
        type: string
        default: Mobench
      regression_threshold_pct:
        description: "Regression threshold percentage"
        required: false
        type: string
        default: "5.0"
      head_sha:
        description: "Exact 40-character PR head commit SHA"
        required: false
        type: string
        default: ""
    secrets:
      BROWSERSTACK_USERNAME:
        required: true
      BROWSERSTACK_ACCESS_KEY:
        required: true
      MOBENCH_APP_PRIVATE_KEY:
        required: false
      MOBENCH_APP_ID:
        required: false

# Every capability is granted to the one job that needs it. In particular,
# PR-controlled build jobs never receive a write-capable token.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Replace this with the immutable commit containing the final 0.1.44
  # prepare/run-prebuilt implementation before enabling the workflow.
  MOBENCH_TRUSTED_SHA: 964aee61011cd7b61448d023cb9fdbe5d99f01f8

jobs:
  validate-request:
    name: Validate requested PR revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.validate.outputs.head_sha }}
      head_repo: ${{ steps.validate.outputs.head_repo }}
    steps:
      - name: Validate full SHA and current PR head
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CALLER_REPO: ${{ github.repository }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="${REQUESTED_SHA:-$DEFAULT_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::head_sha must be a full 40-character commit SHA"
            exit 1
          fi
          sha="${sha,,}"
          head_repo="$CALLER_REPO"

          if [ -n "$PR_NUMBER" ]; then
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::pr_number must be a positive integer"
              exit 1
            fi
            pr_json="$(gh api "repos/${CALLER_REPO}/pulls/${PR_NUMBER}")"
            current_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
            if [ "$sha" != "${current_sha,,}" ]; then
              echo "::error::Requested SHA is not the current head of the requested PR"
              exit 1
            fi
          fi

          if [[ ! "$head_repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid PR head repository"
            exit 1
          fi
          printf 'head_sha=%s\nhead_repo=%s\n' "$sha" "$head_repo" >> "$GITHUB_OUTPUT"

  # Build the trusted control-plane binary from the immutable commit containing
  # this reusable workflow. It is compiled in a job with no secrets, no
  # environment, and no PR checkout; credentialed jobs only download the binary.
  trusted-mobench:
    name: Build trusted mobench control plane
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout immutable mobench workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: worldcoin/mobile-bench-rs
          ref: ${{ env.MOBENCH_TRUSTED_SHA }}
          persist-credentials: false
          path: trusted-mobench-src
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Build trusted cargo-mobench
        working-directory: trusted-mobench-src
        shell: bash
        run: cargo build --locked --release -p mobench --bin cargo-mobench
      - name: Upload trusted cargo-mobench
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: trusted-cargo-mobench
          path: trusted-mobench-src/target/release/cargo-mobench
          if-no-files-found: error
          retention-days: 1

  prepare-ios:
    name: Prepare iOS artifacts (untrusted)
    needs: validate-request
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Revalidate current PR head
        if: inputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ needs.validate-request.outputs.head_sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "${current,,}" = "$EXPECTED_SHA" || { echo "::error::PR head changed before build"; exit 1; }
      - name: Checkout exact untrusted PR revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.validate-request.outputs.head_repo }}
          ref: ${{ needs.validate-request.outputs.head_sha }}
          persist-credentials: false
          path: caller
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ inputs.rust_targets_ios }}
      - name: Ensure required iOS Rust targets
        shell: bash
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Install untrusted build tooling
        shell: bash
        env:
          MOBENCH_VERSION: ${{ inputs.mobench_version }}
          MOBENCH_REF: ${{ inputs.mobench_ref }}
        run: |
          set -euo pipefail
          if [ -f caller/crates/mobench/Cargo.toml ]; then
            cargo install --path caller/crates/mobench --locked --force
          elif [[ "$MOBENCH_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            cargo install mobench --git https://github.com/worldcoin/mobile-bench-rs --rev "$MOBENCH_REF" --locked
          elif [ -n "$MOBENCH_REF" ]; then
            cargo install mobench --git https://github.com/worldcoin/mobile-bench-rs --branch "$MOBENCH_REF" --locked
          elif [ -n "$MOBENCH_VERSION" ]; then
            cargo install mobench --version "$MOBENCH_VERSION" --locked
          else
            cargo install mobench --version 0.1.44 --locked
          fi
          brew install xcodegen
      - name: Install caller-selected binding generator
        shell: bash
        env:
          FFI_BACKEND: ${{ inputs.ffi_backend }}
        run: |
          set -euo pipefail
          if [ "$FFI_BACKEND" = boltffi ] || [ "$FFI_BACKEND" = bolt-ffi ]; then
            cargo install boltffi_cli --version 0.25.2 --locked
          fi
          lockfile="$(find caller -name Cargo.lock -print -quit)"
          [ -n "$lockfile" ] || exit 0
          version="$(awk '$0 == "[[package]]" { p=0 } $0 == "name = \"uniffi_bindgen\"" { p=1; next } p && /^version = / { gsub(/^version = \"|\"$/, "", $0); print; exit }' "$lockfile")"
          if [ -n "$version" ]; then
            cargo install --git https://github.com/mozilla/uniffi-rs --tag "v${version}" \
              uniffi-bindgen-cli --bin uniffi-bindgen
          fi
      - name: Configure requested FFI backend
        if: inputs.ffi_backend != ''
        working-directory: caller
        shell: bash
        env:
          FFI_BACKEND: ${{ inputs.ffi_backend }}
        run: |
          set -euo pipefail
          case "$FFI_BACKEND" in uniffi|native-c-abi|boltffi|bolt-ffi) ;; *) exit 2;; esac
          python3 - <<'PY'
          import os
          from pathlib import Path
          backend = os.environ['FFI_BACKEND']
          path = Path('mobench.toml')
          lines = path.read_text().splitlines() if path.exists() else []
          out, in_project, saw, wrote = [], False, False, False
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('[') and stripped.endswith(']'):
                  if in_project and not wrote: out.append(f'ffi_backend = "{backend}"'); wrote = True
                  in_project = stripped == '[project]'; saw = saw or in_project
              if in_project and stripped.startswith('ffi_backend'):
                  out.append(f'ffi_backend = "{backend}"'); wrote = True
              else: out.append(line)
          if saw and in_project and not wrote: out.append(f'ffi_backend = "{backend}"')
          if not saw:
              if out and out[-1] != '': out.append('')
              out.extend(['[project]', f'ffi_backend = "{backend}"'])
          path.write_text('\n'.join(out) + '\n')
          PY
      - name: Prepare iOS packages and manifest
        working-directory: caller
        shell: bash
        env:
          FUNCTIONS_JSON: ${{ inputs.functions }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
          CRATE_PATH: ${{ inputs.crate_path }}
          HEAD_SHA: ${{ needs.validate-request.outputs.head_sha }}
          RELEASE_FLAG: ${{ inputs.build_release && '--release' || '' }}
        run: |
          set -euo pipefail
          cargo-mobench ci prepare --target ios \
            --functions "$FUNCTIONS_JSON" --iterations "$ITERATIONS" --warmup "$WARMUP" \
            --crate-path "$CRATE_PATH" $RELEASE_FLAG --source-sha "$HEAD_SHA" \
            --output-dir target/mobench/prebuilt/ios \
            --manifest target/mobench/prebuilt/ios/manifest.json
      - name: Upload explicitly enumerated iOS packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobench-prebuilt-ios
          path: |
            caller/target/mobench/prebuilt/ios/manifest.json
            caller/target/mobench/prebuilt/ios/entries/*/app.ipa
            caller/target/mobench/prebuilt/ios/entries/*/test-suite.zip
          if-no-files-found: error
          retention-days: 1

  prepare-android:
    name: Prepare Android artifacts (untrusted)
    needs: validate-request
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Revalidate current PR head
        if: inputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ needs.validate-request.outputs.head_sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "${current,,}" = "$EXPECTED_SHA" || { echo "::error::PR head changed before build"; exit 1; }
      - name: Checkout exact untrusted PR revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.validate-request.outputs.head_repo }}
          ref: ${{ needs.validate-request.outputs.head_sha }}
          persist-credentials: false
          path: caller
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ inputs.rust_targets_android }}
      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@651bceb6f9ca583f16b8d75b62c36ded2ae6fc9c # v4.0.0
      - name: Install Android SDK packages and select NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          "$sdkmanager" --install "platform-tools" "platforms;android-34" \
            "build-tools;34.0.0" "ndk;26.1.10909125" >/dev/null
          ndk="${ANDROID_HOME}/ndk/26.1.10909125"
          [ -d "$ndk" ] || { echo "::error::Required Android NDK is unavailable"; exit 1; }
          printf 'ANDROID_NDK_HOME=%s\nANDROID_NDK_ROOT=%s\n' "$ndk" "$ndk" >> "$GITHUB_ENV"
      - name: Install untrusted build tooling
        shell: bash
        env:
          MOBENCH_VERSION: ${{ inputs.mobench_version }}
          MOBENCH_REF: ${{ inputs.mobench_ref }}
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          if [ -f caller/crates/mobench/Cargo.toml ]; then
            cargo install --path caller/crates/mobench --locked --force
          elif [[ "$MOBENCH_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            cargo install mobench --git https://github.com/worldcoin/mobile-bench-rs --rev "$MOBENCH_REF" --locked
          elif [ -n "$MOBENCH_REF" ]; then
            cargo install mobench --git https://github.com/worldcoin/mobile-bench-rs --branch "$MOBENCH_REF" --locked
          elif [ -n "$MOBENCH_VERSION" ]; then
            cargo install mobench --version "$MOBENCH_VERSION" --locked
          else
            cargo install mobench --version 0.1.44 --locked
          fi
      - name: Install caller-selected binding generator
        shell: bash
        env:
          FFI_BACKEND: ${{ inputs.ffi_backend }}
        run: |
          set -euo pipefail
          if [ "$FFI_BACKEND" = boltffi ] || [ "$FFI_BACKEND" = bolt-ffi ]; then
            cargo install boltffi_cli --version 0.25.2 --locked
          fi
          lockfile="$(find caller -name Cargo.lock -print -quit)"
          [ -n "$lockfile" ] || exit 0
          version="$(awk '$0 == "[[package]]" { p=0 } $0 == "name = \"uniffi_bindgen\"" { p=1; next } p && /^version = / { gsub(/^version = \"|\"$/, "", $0); print; exit }' "$lockfile")"
          if [ -n "$version" ]; then
            cargo install --git https://github.com/mozilla/uniffi-rs --tag "v${version}" \
              uniffi-bindgen-cli --bin uniffi-bindgen
          fi
      - name: Configure requested FFI backend
        if: inputs.ffi_backend != ''
        working-directory: caller
        shell: bash
        env:
          FFI_BACKEND: ${{ inputs.ffi_backend }}
        run: |
          set -euo pipefail
          case "$FFI_BACKEND" in uniffi|native-c-abi|boltffi|bolt-ffi) ;; *) exit 2;; esac
          python3 - <<'PY'
          import os
          from pathlib import Path
          backend = os.environ['FFI_BACKEND']
          path = Path('mobench.toml')
          lines = path.read_text().splitlines() if path.exists() else []
          out, in_project, saw, wrote = [], False, False, False
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('[') and stripped.endswith(']'):
                  if in_project and not wrote: out.append(f'ffi_backend = "{backend}"'); wrote = True
                  in_project = stripped == '[project]'; saw = saw or in_project
              if in_project and stripped.startswith('ffi_backend'):
                  out.append(f'ffi_backend = "{backend}"'); wrote = True
              else: out.append(line)
          if saw and in_project and not wrote: out.append(f'ffi_backend = "{backend}"')
          if not saw:
              if out and out[-1] != '': out.append('')
              out.extend(['[project]', f'ffi_backend = "{backend}"'])
          path.write_text('\n'.join(out) + '\n')
          PY
      - name: Prepare Android packages and manifest
        working-directory: caller
        shell: bash
        env:
          FUNCTIONS_JSON: ${{ inputs.functions }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
          CRATE_PATH: ${{ inputs.crate_path }}
          HEAD_SHA: ${{ needs.validate-request.outputs.head_sha }}
          RELEASE_FLAG: ${{ inputs.build_release && '--release' || '' }}
        run: |
          set -euo pipefail
          cargo-mobench ci prepare --target android \
            --functions "$FUNCTIONS_JSON" --iterations "$ITERATIONS" --warmup "$WARMUP" \
            --crate-path "$CRATE_PATH" $RELEASE_FLAG --source-sha "$HEAD_SHA" \
            --output-dir target/mobench/prebuilt/android \
            --manifest target/mobench/prebuilt/android/manifest.json
      - name: Upload explicitly enumerated Android packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobench-prebuilt-android
          path: |
            caller/target/mobench/prebuilt/android/manifest.json
            caller/target/mobench/prebuilt/android/entries/*/app.apk
            caller/target/mobench/prebuilt/android/entries/*/test.apk
          if-no-files-found: error
          retention-days: 1

  run-ios:
    name: Run prebuilt iOS packages on BrowserStack
    needs: [validate-request, trusted-mobench, prepare-ios]
    runs-on: ubuntu-latest
    environment: browserstack
    permissions:
      actions: read
      pull-requests: read
    steps:
      - name: Download trusted mobench
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-cargo-mobench
          path: trusted-bin
      - name: Download exact run-scoped iOS packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mobench-prebuilt-ios
          path: prebuilt/ios
      - name: Revalidate current PR head before credential use
        if: inputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ needs.validate-request.outputs.head_sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "${current,,}" = "$EXPECTED_SHA" || { echo "::error::PR head changed before BrowserStack run"; exit 1; }
      - name: Resolve and validate iOS device
        id: device
        shell: bash
        env:
          DEVICE_PROFILE: ${{ inputs.device_profile }}
          DEVICE_OVERRIDE: ${{ inputs.ios_device }}
          OS_OVERRIDE: ${{ inputs.ios_os_version }}
        run: |
          set -euo pipefail
          chmod +x trusted-bin/cargo-mobench
          if [ -n "$DEVICE_OVERRIDE" ] && [ -n "$OS_OVERRIDE" ]; then
            device="$DEVICE_OVERRIDE"; os="$OS_OVERRIDE"
          else
            json="$(trusted-bin/cargo-mobench devices resolve --platform ios --profile "$DEVICE_PROFILE" --format json)"
            device="$(jq -r '.device // .name' <<<"$json")"; os="$(jq -r '.os_version' <<<"$json")"
          fi
          device_pattern='^[A-Za-z0-9._+()/ -]{1,100}$'
          os_pattern='^[A-Za-z0-9._+-]{1,32}$'
          [[ "$device" =~ $device_pattern && "$os" =~ $os_pattern ]] || exit 2
          printf 'spec=%s-%s\n' "$device" "$os" >> "$GITHUB_OUTPUT"
      - name: Upload, run, and fetch iOS benchmark
        shell: bash
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          HEAD_SHA: ${{ needs.validate-request.outputs.head_sha }}
          DEVICE_SPEC: ${{ steps.device.outputs.spec }}
          FUNCTIONS_JSON: ${{ inputs.functions }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
        run: |
          set -euo pipefail
          trusted-bin/cargo-mobench ci run-prebuilt \
            --manifest prebuilt/ios/manifest.json --expected-source-sha "$HEAD_SHA" \
            --expected-platform ios --expected-functions "$FUNCTIONS_JSON" \
            --expected-iterations "$ITERATIONS" --expected-warmup "$WARMUP" \
            --devices "$DEVICE_SPEC" --fetch --fetch-output-dir target/browserstack \
            --output-dir target/mobench/ci/ios
      - name: Upload iOS results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobench-results-ios
          path: |
            target/mobench/ci/ios/summary.json
            target/mobench/ci/ios/summary.md
            target/mobench/ci/ios/results.csv
          if-no-files-found: warn
      - name: Upload collected iOS BrowserStack diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobench-browserstack-ios
          path: |
            target/browserstack/**/*.json
            target/browserstack/**/*.log
            target/browserstack/**/*.txt
          if-no-files-found: warn

  run-android:
    name: Run prebuilt Android packages on BrowserStack
    needs: [validate-request, trusted-mobench, prepare-android]
    runs-on: ubuntu-latest
    environment: browserstack
    permissions:
      actions: read
      pull-requests: read
    steps:
      - name: Download trusted mobench
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-cargo-mobench
          path: trusted-bin
      - name: Download exact run-scoped Android packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mobench-prebuilt-android
          path: prebuilt/android
      - name: Revalidate current PR head before credential use
        if: inputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ needs.validate-request.outputs.head_sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "${current,,}" = "$EXPECTED_SHA" || { echo "::error::PR head changed before BrowserStack run"; exit 1; }
      - name: Resolve and validate Android device
        id: device
        shell: bash
        env:
          DEVICE_PROFILE: ${{ inputs.device_profile }}
          DEVICE_OVERRIDE: ${{ inputs.android_device }}
          OS_OVERRIDE: ${{ inputs.android_os_version }}
        run: |
          set -euo pipefail
          chmod +x trusted-bin/cargo-mobench
          if [ -n "$DEVICE_OVERRIDE" ] && [ -n "$OS_OVERRIDE" ]; then
            device="$DEVICE_OVERRIDE"; os="$OS_OVERRIDE"
          else
            json="$(trusted-bin/cargo-mobench devices resolve --platform android --profile "$DEVICE_PROFILE" --format json)"
            device="$(jq -r '.device // .name' <<<"$json")"; os="$(jq -r '.os_version' <<<"$json")"
          fi
          device_pattern='^[A-Za-z0-9._+()/ -]{1,100}$'
          os_pattern='^[A-Za-z0-9._+-]{1,32}$'
          [[ "$device" =~ $device_pattern && "$os" =~ $os_pattern ]] || exit 2
          printf 'spec=%s-%s\n' "$device" "$os" >> "$GITHUB_OUTPUT"
      - name: Upload, run, and fetch Android benchmark
        shell: bash
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          HEAD_SHA: ${{ needs.validate-request.outputs.head_sha }}
          DEVICE_SPEC: ${{ steps.device.outputs.spec }}
          FUNCTIONS_JSON: ${{ inputs.functions }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
        run: |
          set -euo pipefail
          trusted-bin/cargo-mobench ci run-prebuilt \
            --manifest prebuilt/android/manifest.json --expected-source-sha "$HEAD_SHA" \
            --expected-platform android --expected-functions "$FUNCTIONS_JSON" \
            --expected-iterations "$ITERATIONS" --expected-warmup "$WARMUP" \
            --devices "$DEVICE_SPEC" --fetch --fetch-output-dir target/browserstack \
            --output-dir target/mobench/ci/android
      - name: Upload Android results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobench-results-android
          path: |
            target/mobench/ci/android/summary.json
            target/mobench/ci/android/summary.md
            target/mobench/ci/android/results.csv
          if-no-files-found: warn
      - name: Upload collected Android BrowserStack diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobench-browserstack-android
          path: |
            target/browserstack/**/*.json
            target/browserstack/**/*.log
            target/browserstack/**/*.txt
          if-no-files-found: warn

  summarize:
    name: Sanitize and summarize benchmark results
    needs: [validate-request, trusted-mobench, run-ios, run-android]
    if: always() && (needs.run-ios.result == 'success' || needs.run-android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download trusted mobench
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-cargo-mobench
          path: trusted-bin
      - name: Download iOS results
        if: needs.run-ios.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mobench-results-ios
          path: results/ios
      - name: Download Android results
        if: needs.run-android.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mobench-results-android
          path: results/android
      - name: Reject unsafe report paths and fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          roots = [p for p in (Path('results/ios'), Path('results/android')) if p.exists()]
          allowed = {'summary.json', 'summary.md', 'results.csv'}
          unsafe = re.compile(r'[\x00-\x1f\x7f]|[<>`\[\]|!]|(?:^|\n)::')
          for root in roots:
              for p in root.rglob('*'):
                  if p.is_symlink() or (p.is_file() and p.stat().st_size > 50 * 1024 * 1024):
                      raise SystemExit('unsafe report artifact')
              summaries = list(root.rglob('summary.json'))
              if len(summaries) != 1 or summaries[0].name not in allowed:
                  raise SystemExit('expected exactly one summary.json')
              payload = json.loads(summaries[0].read_text())
              def check(v, depth=0):
                  if depth > 32: raise SystemExit('report nesting too deep')
                  if isinstance(v, str) and (len(v) > 4096 or unsafe.search(v)):
                      raise SystemExit('unsafe report field')
                  if isinstance(v, dict):
                      for k, x in v.items(): check(k, depth+1); check(x, depth+1)
                  elif isinstance(v, list):
                      for x in v: check(x, depth+1)
              check(payload)
          PY
      - name: Render trusted summaries
        shell: bash
        run: |
          set -euo pipefail
          chmod +x trusted-bin/cargo-mobench
          mkdir -p rendered
          for platform in ios android; do
            summary="$(find "results/$platform" -type f -name summary.json -print -quit 2>/dev/null || true)"
            if [ -n "$summary" ]; then
              mkdir -p "rendered/$platform"
              trusted-bin/cargo-mobench report summarize --summary "$summary" \
                --output "rendered/$platform/summary.md" --plots off
            fi
          done
      - name: Write job summary
        shell: bash
        run: |
          set -euo pipefail
          for platform in ios android; do
            if [ -f "rendered/$platform/summary.md" ]; then
              printf '## %s Benchmark Results\n\n' "${platform^}" >> "$GITHUB_STEP_SUMMARY"
              cat "rendered/$platform/summary.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Build history bundle
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ needs.validate-request.outputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          set -euo pipefail
          mkdir -p history-bundle
          platforms='[]'
          for platform in ios android; do
            source="$(find "results/$platform" -type f -name summary.json -print -quit 2>/dev/null || true)"
            [ -n "$source" ] || continue
            mkdir -p "history-bundle/$platform"
            cp "$source" "history-bundle/$platform/summary.json"
            csv="$(find "results/$platform" -type f -name results.csv -print -quit 2>/dev/null || true)"
            [ -z "$csv" ] || cp "$csv" "history-bundle/$platform/results.csv"
            platforms="$(jq --arg p "$platform" '. + [$p]' <<<"$platforms")"
          done
          jq -n --arg sha "$HEAD_SHA" --arg pr "$PR_NUMBER" --arg by "$REQUESTED_BY" \
            --argjson platforms "$platforms" \
            '{schema_version:"mobench-history-v1",commit_sha:$sha,pr_number:(if $pr == "" then null else ($pr|tonumber) end),requested_by:$by,platforms:$platforms}' \
            > history-bundle/manifest.json
      - name: Upload sanitized report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobench-sanitized-report
          path: |
            rendered/ios/summary.md
            rendered/android/summary.md
            results/ios/**/summary.json
            results/android/**/summary.json
          if-no-files-found: error
      - name: Upload history bundle
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobench-history-bundle
          path: |
            history-bundle/manifest.json
            history-bundle/ios/summary.json
            history-bundle/ios/results.csv
            history-bundle/android/summary.json
            history-bundle/android/results.csv
          if-no-files-found: warn

  report:
    name: Publish PR and check-run reports
    needs: [validate-request, trusted-mobench, summarize]
    if: inputs.pr_number != '' && needs.summarize.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      checks: write
    steps:
      - name: Download trusted mobench
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-cargo-mobench
          path: trusted-bin
      - name: Download sanitized report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mobench-sanitized-report
          path: report
      - name: Publish sticky PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- mobench-summary -->'
          body_file="$(mktemp)"
          printf '%s\n## Mobench Benchmark Results\n\n' "$marker" > "$body_file"
          for platform in ios android; do
            summary="report/rendered/$platform/summary.md"
            if [ -f "$summary" ]; then
              printf '## %s Benchmark Results\n\n' "${platform^}" >> "$body_file"
              cat "$summary" >> "$body_file"
              printf '\n' >> "$body_file"
            fi
          done
          jq -n --rawfile body "$body_file" '{body:$body}' > request.json
          existing="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -1)"
          if [ -n "$existing" ]; then
            gh api "repos/${REPO}/issues/comments/${existing}" -X PATCH --input request.json --silent
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -X POST --input request.json --silent
          fi
      - name: Create threshold-aware check runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.validate-request.outputs.head_sha }}
          CHECK_NAME: ${{ inputs.check_run_name }}
          REGRESSION_THRESHOLD: ${{ inputs.regression_threshold_pct }}
          CRATE_PATH: ${{ inputs.crate_path }}
        run: |
          set -euo pipefail
          chmod +x trusted-bin/cargo-mobench
          [[ "$REGRESSION_THRESHOLD" =~ ^[0-9]+([.][0-9]+)?$ ]] || exit 2
          [[ "$CRATE_PATH" != /* && "$CRATE_PATH" != *..* && "$CRATE_PATH" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 2
          for platform in ios android; do
            results="report/results/$platform"
            [ -d "$results" ] || continue
            trusted-bin/cargo-mobench ci check-run \
              --results-dir "$results" --repo "$REPO" --sha "$HEAD_SHA" \
              --name "$CHECK_NAME — $platform" \
              --annotation-path "$CRATE_PATH/src/lib.rs" \
              --regression-threshold-pct "$REGRESSION_THRESHOLD"
          done
