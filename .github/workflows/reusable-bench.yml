name: Reusable Mobile Benchmark (BrowserStack)

on:
  workflow_call:
    inputs:
      crate_path:
        description: "Path to the benchmark crate in the caller repo"
        required: true
        type: string
      source_repository:
        description: "Optional pinned external owner/repo used only for an allow_non_pr release gate"
        required: false
        type: string
        default: ""
      functions:
        description: "JSON array or comma-separated benchmark function names"
        required: true
        type: string
      functions_ios:
        description: "Optional iOS function list; defaults to functions"
        required: false
        type: string
        default: ""
      functions_android:
        description: "Optional Android function list; defaults to functions"
        required: false
        type: string
        default: ""
      prepare_script:
        description: "Optional repository-relative shell script run only in secretless prepare jobs"
        required: false
        type: string
        default: ""
      prepare_attempts:
        description: "Bounded attempts for a transiently failing untrusted prepare script (1-3)"
        required: false
        type: number
        default: 1
      iterations:
        description: "Number of benchmark iterations"
        required: false
        type: string
        default: "30"
      warmup:
        description: "Number of warmup iterations"
        required: false
        type: string
        default: "5"
      platform:
        description: "Target platform: android, ios, or both"
        required: false
        type: string
        default: both
      device_profile:
        description: "Device profile: low-spec, mid-spec, high-spec, custom"
        required: false
        type: string
        default: low-spec
      ios_device:
        description: "Custom iOS device name"
        required: false
        type: string
        default: ""
      ios_os_version:
        description: "Custom iOS OS version"
        required: false
        type: string
        default: ""
      ios_devices:
        description: 'Optional JSON array of {"device":"...","os_version":"..."}; overrides the single-device/profile inputs'
        required: false
        type: string
        default: ""
      android_device:
        description: "Custom Android device name"
        required: false
        type: string
        default: ""
      android_os_version:
        description: "Custom Android OS version"
        required: false
        type: string
        default: ""
      android_devices:
        description: 'Optional JSON array of {"device":"...","os_version":"..."}; overrides the single-device/profile inputs'
        required: false
        type: string
        default: ""
      rust_targets_ios:
        description: "Comma-separated iOS Rust targets"
        required: false
        type: string
        default: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      rust_targets_android:
        description: "Comma-separated Android Rust targets"
        required: false
        type: string
        default: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      rust_toolchain:
        description: "Rust toolchain used for caller builds (for example stable or nightly-2026-03-04)"
        required: false
        type: string
        default: stable
      build_release:
        description: "Build in release mode"
        required: false
        type: boolean
        default: true
      mobench_version:
        description: "Mobench version used only in the untrusted prepare jobs"
        required: false
        type: string
        default: ""
      mobench_ref:
        description: "Mobench git ref used only in the untrusted prepare jobs"
        required: false
        type: string
        default: ""
      mobench_sdk_ref:
        description: "Optional full mobench commit SHA used to patch mobench-sdk in secretless prepare jobs"
        required: false
        type: string
        default: ""
      artifact_prefix:
        description: "Optional safe prefix for artifacts when multiple reusable benchmarks share one run"
        required: false
        type: string
        default: ""
      max_completion_timeout_secs:
        description: "Trusted upper bound for BrowserStack completion waits (maximum 21600)"
        required: false
        type: number
        default: 1800
      ffi_backend:
        description: "Optional ci prepare FFI backend override: uniffi, native-c-abi, or boltffi"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR number for current-head validation and reporting"
        required: false
        type: string
        default: ""
      allow_non_pr:
        description: "Explicitly allow a non-PR self-test (PR freshness checks are disabled)"
        required: false
        type: boolean
        default: false
      requested_by:
        description: "Who triggered the run"
        required: false
        type: string
        default: ""
      check_run_name:
        description: "GitHub Check Run name"
        required: false
        type: string
        default: Mobench
      regression_threshold_pct:
        description: "Regression threshold percentage"
        required: false
        type: string
        default: "5.0"
      head_sha:
        description: "Exact 40-character PR head commit SHA"
        required: true
        type: string
    secrets:
      BROWSERSTACK_USERNAME:
        required: true
      BROWSERSTACK_ACCESS_KEY:
        required: true
      MOBENCH_APP_PRIVATE_KEY:
        required: false
      MOBENCH_APP_ID:
        required: false

# Every capability is granted to the one job that needs it. In particular,
# PR-controlled build jobs never receive a write-capable token.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The credentialed control plane always builds from this reviewed immutable
  # 0.1.49 implementation, independently of the caller's selected build tool.
  MOBENCH_TRUSTED_SHA: 13d716e3187bf4f0576276b738fd6d67a307e3c5

jobs:
  validate-request:
    name: Validate requested PR revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.validate.outputs.head_sha }}
      head_repo: ${{ steps.validate.outputs.head_repo }}
      functions_ios: ${{ steps.validate.outputs.functions_ios }}
      functions_android: ${{ steps.validate.outputs.functions_android }}
      ios_devices: ${{ steps.validate.outputs.ios_devices }}
      android_devices: ${{ steps.validate.outputs.android_devices }}
      ffi_backend: ${{ steps.validate.outputs.ffi_backend }}
      rust_toolchain: ${{ steps.validate.outputs.rust_toolchain }}
    steps:
      - name: Validate full SHA and current PR head
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ALLOW_NON_PR: ${{ inputs.allow_non_pr }}
          CALLER_REPO: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          FUNCTIONS: ${{ inputs.functions }}
          FUNCTIONS_IOS: ${{ inputs.functions_ios }}
          FUNCTIONS_ANDROID: ${{ inputs.functions_android }}
          IOS_DEVICES: ${{ inputs.ios_devices }}
          ANDROID_DEVICES: ${{ inputs.android_devices }}
          FFI_BACKEND: ${{ inputs.ffi_backend }}
          RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
          MOBENCH_SDK_REF: ${{ inputs.mobench_sdk_ref }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
          PREPARE_ATTEMPTS: ${{ inputs.prepare_attempts }}
        run: |
          set -euo pipefail
          sha="$REQUESTED_SHA"
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::head_sha must be a full 40-character commit SHA"
            exit 1
          fi
          sha="${sha,,}"
          head_repo="$CALLER_REPO"

          if [ -n "$SOURCE_REPOSITORY" ]; then
            if [ "$ALLOW_NON_PR" != true ] || [ -n "$PR_NUMBER" ]; then
              echo "::error::source_repository requires allow_non_pr and cannot be combined with pr_number"
              exit 1
            fi
            head_repo="$SOURCE_REPOSITORY"
          fi

          if [ -z "$PR_NUMBER" ] && [ "$ALLOW_NON_PR" != true ]; then
            echo "::error::pr_number is required unless allow_non_pr is explicitly enabled"
            exit 1
          fi

          if [ -n "$PR_NUMBER" ]; then
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::pr_number must be a positive integer"
              exit 1
            fi
            for attempt in 1 2 3 4 5; do
              if pr_json="$(gh api "repos/${CALLER_REPO}/pulls/${PR_NUMBER}")"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Unable to validate the current PR head after 5 attempts"
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
            current_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
            if [ "$sha" != "${current_sha,,}" ]; then
              echo "::error::Requested SHA is not the current head of the requested PR"
              exit 1
            fi
          fi

          if [[ ! "$head_repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid PR head repository"
            exit 1
          fi
          if [ -n "$MOBENCH_SDK_REF" ] && [[ ! "$MOBENCH_SDK_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::mobench_sdk_ref must be a full 40-character commit SHA"
            exit 1
          fi
          if [[ ! "$ARTIFACT_PREFIX" =~ ^[A-Za-z0-9._-]{0,40}$ ]]; then
            echo "::error::artifact_prefix contains unsupported characters"
            exit 1
          fi
          if [[ ! "$PREPARE_ATTEMPTS" =~ ^[1-3]$ ]]; then
            echo "::error::prepare_attempts must be an integer from 1 through 3"
            exit 1
          fi
          case "$FFI_BACKEND" in
            ""|uniffi|native-c-abi|boltffi) ;;
            bolt-ffi) FFI_BACKEND=boltffi ;;
            *) echo "::error::ffi_backend must be uniffi, native-c-abi, or boltffi"; exit 1 ;;
          esac
          if [[ ! "$RUST_TOOLCHAIN" =~ ^[A-Za-z0-9._+-]{1,100}$ ]]; then
            echo "::error::rust_toolchain contains unsupported characters"
            exit 1
          fi
          printf 'head_sha=%s\nhead_repo=%s\nffi_backend=%s\nrust_toolchain=%s\n' \
            "$sha" "$head_repo" "$FFI_BACKEND" "$RUST_TOOLCHAIN" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os, re

          def normalize_functions(value, label):
              value = value.strip()
              if value.startswith('['):
                  try:
                      functions = json.loads(value)
                  except json.JSONDecodeError as error:
                      raise SystemExit(f'{label} must be a JSON string array or comma-separated list: {error}')
                  if not isinstance(functions, list) or not all(isinstance(item, str) for item in functions):
                      raise SystemExit(f'{label} must be a JSON string array')
              else:
                  functions = value.split(',')
              functions = [item.strip() for item in functions if item.strip()]
              if not 1 <= len(functions) <= 64:
                  raise SystemExit(f'{label} must contain 1..64 benchmark functions')
              if len(set(functions)) != len(functions):
                  raise SystemExit(f'{label} contains duplicate benchmark functions')
              if any(len(item) > 512 or any(ord(char) < 32 or ord(char) == 127 for char in item) for item in functions):
                  raise SystemExit(f'{label} contains an invalid benchmark function')
              return json.dumps(functions, separators=(',', ':'))

          def normalize_devices(value, label):
              if not value.strip():
                  return ''
              try:
                  devices = json.loads(value)
              except json.JSONDecodeError as error:
                  raise SystemExit(f'{label} must be a JSON array: {error}')
              if not isinstance(devices, list) or not 1 <= len(devices) <= 16:
                  raise SystemExit(f'{label} must contain 1..16 devices')
              device_pattern = re.compile(r'^[A-Za-z0-9._+()/ -]{1,100}$')
              os_pattern = re.compile(r'^[A-Za-z0-9._+-]{1,32}$')
              normalized = []
              seen = set()
              for index, item in enumerate(devices):
                  if not isinstance(item, dict) or set(item) != {'device', 'os_version'}:
                      raise SystemExit(f'{label}[{index}] must contain only device and os_version')
                  device, os_version = item['device'], item['os_version']
                  if not isinstance(device, str) or not isinstance(os_version, str):
                      raise SystemExit(f'{label}[{index}] fields must be strings')
                  if not device_pattern.fullmatch(device) or not os_pattern.fullmatch(os_version):
                      raise SystemExit(f'{label}[{index}] contains an invalid device or OS version')
                  spec = f'{device}-{os_version}'
                  if spec in seen:
                      raise SystemExit(f'{label} contains duplicate devices')
                  seen.add(spec)
                  normalized.append({'device': device, 'os_version': os_version})
              return json.dumps(normalized, separators=(',', ':'))

          shared = os.environ['FUNCTIONS']
          ios_functions = os.environ['FUNCTIONS_IOS'].strip() or shared
          android_functions = os.environ['FUNCTIONS_ANDROID'].strip() or shared
          outputs = {
              'functions_ios': normalize_functions(ios_functions, 'functions_ios'),
              'functions_android': normalize_functions(android_functions, 'functions_android'),
              'ios_devices': normalize_devices(os.environ['IOS_DEVICES'], 'ios_devices'),
              'android_devices': normalize_devices(os.environ['ANDROID_DEVICES'], 'android_devices'),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in outputs.items():
                  output.write(f'{key}={value}\n')
          PY

  # Build the trusted control-plane binary from the immutable commit containing
  # this reusable workflow. It is compiled in a job with no secrets, no
  # environment, and no PR checkout; credentialed jobs only download the binary.
  trusted-mobench:
    name: Build trusted mobench control plane
    needs: validate-request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout immutable mobench workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: worldcoin/mobile-bench-rs
          ref: ${{ env.MOBENCH_TRUSTED_SHA }}
          persist-credentials: false
          path: trusted-mobench-src
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Build trusted cargo-mobench
        working-directory: trusted-mobench-src
        shell: bash
        run: cargo build --locked --release -p mobench --bin cargo-mobench
      - name: Upload trusted cargo-mobench
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.artifact_prefix }}trusted-cargo-mobench
          path: trusted-mobench-src/target/release/cargo-mobench
          if-no-files-found: error
          retention-days: 1

  prepare-ios:
    name: Prepare iOS artifacts (untrusted)
    needs: validate-request
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Revalidate current PR head
        if: inputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ needs.validate-request.outputs.head_sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if current="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Unable to revalidate the current PR head after 5 attempts"
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          current="$(printf '%s' "$current" | tr '[:upper:]' '[:lower:]')"
          test "$current" = "$EXPECTED_SHA" || { echo "::error::PR head changed before build"; exit 1; }
      - name: Checkout exact untrusted PR revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.validate-request.outputs.head_repo }}
          ref: ${{ needs.validate-request.outputs.head_sha }}
          persist-credentials: false
          path: caller
      - name: Checkout mobench SDK under test
        if: inputs.mobench_sdk_ref != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: worldcoin/mobile-bench-rs
          ref: ${{ inputs.mobench_sdk_ref }}
          persist-credentials: false
          path: mobench-sdk-under-test
      - name: Patch caller to mobench SDK under test
        if: inputs.mobench_sdk_ref != ''
        shell: bash
        env:
          CALLER_ROOT: ${{ github.workspace }}/caller
          SDK_ROOT: ${{ github.workspace }}/mobench-sdk-under-test/crates/mobench-sdk
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          manifest = Path(os.environ["CALLER_ROOT"]) / "Cargo.toml"
          sdk = Path(os.environ["SDK_ROOT"]).resolve(strict=True)
          text = manifest.read_text()
          if "[patch.crates-io]" in text:
              raise SystemExit("caller already defines [patch.crates-io]")
          manifest.write_text(
              text.rstrip()
              + f'\n\n[patch.crates-io]\nmobench-sdk = {{ path = "{sdk}" }}\n'
          )
          PY
          version="$(cargo metadata --manifest-path mobench-sdk-under-test/Cargo.toml --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "mobench-sdk") | .version')"
          cargo update --manifest-path caller/Cargo.toml -p mobench-sdk --precise "$version"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ needs.validate-request.outputs.rust_toolchain }}
          targets: ${{ inputs.rust_targets_ios }}
      - name: Install untrusted build tooling
        shell: bash
        env:
          MOBENCH_VERSION: ${{ inputs.mobench_version }}
          MOBENCH_REF: ${{ inputs.mobench_ref }}
        run: |
          set -euo pipefail
          if [ -f caller/crates/mobench/Cargo.toml ]; then
            cargo install --path caller/crates/mobench --locked --force
          elif [[ "$MOBENCH_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            cargo install mobench --git https://github.com/worldcoin/mobile-bench-rs --rev "$MOBENCH_REF" --locked
          elif [ -n "$MOBENCH_REF" ]; then
            cargo install mobench --git https://github.com/worldcoin/mobile-bench-rs --branch "$MOBENCH_REF" --locked
          elif [ -n "$MOBENCH_VERSION" ]; then
            cargo install mobench --version "$MOBENCH_VERSION" --locked
          else
            cargo install mobench --version 0.1.49 --locked
          fi
          brew install xcodegen
      - name: Install caller-selected binding generator
        shell: bash
        env:
          FFI_BACKEND: ${{ needs.validate-request.outputs.ffi_backend }}
          CRATE_PATH: ${{ inputs.crate_path }}
        run: |
          set -euo pipefail
          manifest="$(python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path('caller').resolve(strict=True)
          candidate = (root / os.environ['CRATE_PATH']).resolve(strict=True)
          candidate.relative_to(root)
          manifest = candidate if candidate.name == 'Cargo.toml' else candidate / 'Cargo.toml'
          if not manifest.is_file():
              raise SystemExit('crate_path does not identify a Cargo manifest')
          print(manifest)
          PY
          )"
          configured_backend="$(MANIFEST="$manifest" python3 - <<'PY'
          import os, tomllib
          from pathlib import Path

          root = Path('caller').resolve(strict=True)
          current = Path(os.environ['MANIFEST']).parent
          while True:
              config = current / 'mobench.toml'
              if config.is_file():
                  value = tomllib.loads(config.read_text()).get('project', {}).get('ffi_backend', '')
                  print(value)
                  break
              if current == root:
                  print('')
                  break
              current = current.parent
          PY
          )"
          backend="${FFI_BACKEND:-${configured_backend:-uniffi}}"
          case "$backend" in
            native-c-abi) exit 0 ;;
            boltffi|bolt-ffi)
            cargo install boltffi_cli --version 0.25.2 --locked
            exit 0
            ;;
            uniffi) ;;
            *) echo "::error::Unsupported configured FFI backend: $backend"; exit 2 ;;
          esac
          workspace_root="$(cargo metadata --manifest-path "$manifest" --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace_root"])')"
          lockfile="$workspace_root/Cargo.lock"
          [ -f "$lockfile" ] || exit 0
          version="$(awk '$0 == "[[package]]" { p=0 } $0 == "name = \"uniffi_bindgen\"" { p=1; next } p && /^version = / { gsub(/^version = \"|\"$/, "", $0); print; exit }' "$lockfile")"
          if [ -n "$version" ]; then
            cargo install --git https://github.com/mozilla/uniffi-rs --tag "v${version}" \
              uniffi --features cli --bin uniffi-bindgen
          fi
      - name: Run caller preparation hook (untrusted)
        if: inputs.prepare_script != ''
        working-directory: caller
        shell: bash
        env:
          MOBENCH_CI_PREPARE: "1"
          MOBENCH_PLATFORM: ios
          PREPARE_SCRIPT: ${{ inputs.prepare_script }}
          PREPARE_ATTEMPTS: ${{ inputs.prepare_attempts }}
        run: |
          set -euo pipefail
          script="$(python3 - <<'PY'
          import os
          from pathlib import Path, PurePosixPath

          raw = os.environ['PREPARE_SCRIPT']
          if (not raw or len(raw) > 512 or '\\' in raw
                  or any(ord(char) < 32 or ord(char) == 127 for char in raw)):
              raise SystemExit('prepare_script is not a valid repository-relative path')
          relative = PurePosixPath(raw)
          if relative.is_absolute() or raw != relative.as_posix() or any(part in ('', '.', '..') for part in relative.parts):
              raise SystemExit('prepare_script must be a normalized repository-relative path')
          root = Path.cwd().resolve(strict=True)
          try:
              resolved = (root / Path(*relative.parts)).resolve(strict=True)
              resolved.relative_to(root)
          except (FileNotFoundError, RuntimeError, ValueError):
              raise SystemExit('prepare_script is missing or escapes the caller checkout')
          if not resolved.is_file():
              raise SystemExit('prepare_script must resolve to a regular file')
          print(resolved)
          PY
          )"
          for attempt in $(seq 1 "$PREPARE_ATTEMPTS"); do
            if bash -- "$script"; then
              exit 0
            fi
            if [ "$attempt" -eq "$PREPARE_ATTEMPTS" ]; then
              echo "::error::prepare_script failed after ${PREPARE_ATTEMPTS} attempt(s)"
              exit 1
            fi
            echo "::warning::prepare_script attempt ${attempt} failed; retrying"
            sleep "$((attempt * 5))"
          done
      - name: Prepare iOS packages and manifest
        working-directory: caller
        shell: bash
        env:
          MOBENCH_CI_PREPARE: "1"
          FUNCTIONS_JSON: ${{ needs.validate-request.outputs.functions_ios }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
          CRATE_PATH: ${{ inputs.crate_path }}
          HEAD_SHA: ${{ needs.validate-request.outputs.head_sha }}
          BUILD_RELEASE: ${{ inputs.build_release }}
          FFI_BACKEND: ${{ needs.validate-request.outputs.ffi_backend }}
        run: |
          set -euo pipefail
          release_args=()
          if [ "$BUILD_RELEASE" = true ]; then release_args+=(--release); fi
          backend_args=()
          if [ -n "$FFI_BACKEND" ]; then backend_args+=(--ffi-backend "$FFI_BACKEND"); fi
          cargo-mobench ci prepare --target ios \
            --functions "$FUNCTIONS_JSON" --iterations "$ITERATIONS" --warmup "$WARMUP" \
            --crate-path "$CRATE_PATH" "${backend_args[@]}" "${release_args[@]}" --source-sha "$HEAD_SHA" \
            --output-dir target/mobench/prebuilt/ios \
            --manifest target/mobench/prebuilt/ios/manifest.json
      - name: Upload explicitly enumerated iOS packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.artifact_prefix }}mobench-prebuilt-ios
          path: |
            caller/target/mobench/prebuilt/ios/manifest.json
            caller/target/mobench/prebuilt/ios/entries/*/app.ipa
            caller/target/mobench/prebuilt/ios/entries/*/test-suite.zip
          if-no-files-found: error
          retention-days: 1

  prepare-android:
    name: Prepare Android artifacts (untrusted)
    needs: validate-request
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: macos-14
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Revalidate current PR head
        if: inputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ needs.validate-request.outputs.head_sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if current="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Unable to revalidate the current PR head after 5 attempts"
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          current="$(printf '%s' "$current" | tr '[:upper:]' '[:lower:]')"
          test "$current" = "$EXPECTED_SHA" || { echo "::error::PR head changed before build"; exit 1; }
      - name: Checkout exact untrusted PR revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.validate-request.outputs.head_repo }}
          ref: ${{ needs.validate-request.outputs.head_sha }}
          persist-credentials: false
          path: caller
      - name: Checkout mobench SDK under test
        if: inputs.mobench_sdk_ref != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: worldcoin/mobile-bench-rs
          ref: ${{ inputs.mobench_sdk_ref }}
          persist-credentials: false
          path: mobench-sdk-under-test
      - name: Patch caller to mobench SDK under test
        if: inputs.mobench_sdk_ref != ''
        shell: bash
        env:
          CALLER_ROOT: ${{ github.workspace }}/caller
          SDK_ROOT: ${{ github.workspace }}/mobench-sdk-under-test/crates/mobench-sdk
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          manifest = Path(os.environ["CALLER_ROOT"]) / "Cargo.toml"
          sdk = Path(os.environ["SDK_ROOT"]).resolve(strict=True)
          text = manifest.read_text()
          if "[patch.crates-io]" in text:
              raise SystemExit("caller already defines [patch.crates-io]")
          manifest.write_text(
              text.rstrip()
              + f'\n\n[patch.crates-io]\nmobench-sdk = {{ path = "{sdk}" }}\n'
          )
          PY
          version="$(cargo metadata --manifest-path mobench-sdk-under-test/Cargo.toml --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "mobench-sdk") | .version')"
          cargo update --manifest-path caller/Cargo.toml -p mobench-sdk --precise "$version"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ needs.validate-request.outputs.rust_toolchain }}
          targets: ${{ inputs.rust_targets_android }}
      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@651bceb6f9ca583f16b8d75b62c36ded2ae6fc9c # v4.0.0
      - name: Install Android SDK packages and select NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          "$sdkmanager" --install "platform-tools" "platforms;android-34" \
            "build-tools;34.0.0" "ndk;26.1.10909125" >/dev/null
          ndk="${ANDROID_HOME}/ndk/26.1.10909125"
          [ -d "$ndk" ] || { echo "::error::Required Android NDK is unavailable"; exit 1; }
          printf 'ANDROID_NDK_HOME=%s\nANDROID_NDK_ROOT=%s\n' "$ndk" "$ndk" >> "$GITHUB_ENV"
      - name: Install untrusted build tooling
        shell: bash
        env:
          MOBENCH_VERSION: ${{ inputs.mobench_version }}
          MOBENCH_REF: ${{ inputs.mobench_ref }}
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          if [ -f caller/crates/mobench/Cargo.toml ]; then
            cargo install --path caller/crates/mobench --locked --force
          elif [[ "$MOBENCH_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            cargo install mobench --git https://github.com/worldcoin/mobile-bench-rs --rev "$MOBENCH_REF" --locked
          elif [ -n "$MOBENCH_REF" ]; then
            cargo install mobench --git https://github.com/worldcoin/mobile-bench-rs --branch "$MOBENCH_REF" --locked
          elif [ -n "$MOBENCH_VERSION" ]; then
            cargo install mobench --version "$MOBENCH_VERSION" --locked
          else
            cargo install mobench --version 0.1.49 --locked
          fi
      - name: Install caller-selected binding generator
        shell: bash
        env:
          FFI_BACKEND: ${{ needs.validate-request.outputs.ffi_backend }}
          CRATE_PATH: ${{ inputs.crate_path }}
        run: |
          set -euo pipefail
          manifest="$(python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path('caller').resolve(strict=True)
          candidate = (root / os.environ['CRATE_PATH']).resolve(strict=True)
          candidate.relative_to(root)
          manifest = candidate if candidate.name == 'Cargo.toml' else candidate / 'Cargo.toml'
          if not manifest.is_file():
              raise SystemExit('crate_path does not identify a Cargo manifest')
          print(manifest)
          PY
          )"
          configured_backend="$(MANIFEST="$manifest" python3 - <<'PY'
          import os, tomllib
          from pathlib import Path

          root = Path('caller').resolve(strict=True)
          current = Path(os.environ['MANIFEST']).parent
          while True:
              config = current / 'mobench.toml'
              if config.is_file():
                  value = tomllib.loads(config.read_text()).get('project', {}).get('ffi_backend', '')
                  print(value)
                  break
              if current == root:
                  print('')
                  break
              current = current.parent
          PY
          )"
          backend="${FFI_BACKEND:-${configured_backend:-uniffi}}"
          case "$backend" in
            native-c-abi) exit 0 ;;
            boltffi|bolt-ffi)
            cargo install boltffi_cli --version 0.25.2 --locked
            exit 0
            ;;
            uniffi) ;;
            *) echo "::error::Unsupported configured FFI backend: $backend"; exit 2 ;;
          esac
          workspace_root="$(cargo metadata --manifest-path "$manifest" --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace_root"])')"
          lockfile="$workspace_root/Cargo.lock"
          [ -f "$lockfile" ] || exit 0
          version="$(awk '$0 == "[[package]]" { p=0 } $0 == "name = \"uniffi_bindgen\"" { p=1; next } p && /^version = / { gsub(/^version = \"|\"$/, "", $0); print; exit }' "$lockfile")"
          if [ -n "$version" ]; then
            cargo install --git https://github.com/mozilla/uniffi-rs --tag "v${version}" \
              uniffi --features cli --bin uniffi-bindgen
          fi
      - name: Run caller preparation hook (untrusted)
        if: inputs.prepare_script != ''
        working-directory: caller
        shell: bash
        env:
          MOBENCH_CI_PREPARE: "1"
          MOBENCH_PLATFORM: android
          PREPARE_SCRIPT: ${{ inputs.prepare_script }}
          PREPARE_ATTEMPTS: ${{ inputs.prepare_attempts }}
        run: |
          set -euo pipefail
          script="$(python3 - <<'PY'
          import os
          from pathlib import Path, PurePosixPath

          raw = os.environ['PREPARE_SCRIPT']
          if (not raw or len(raw) > 512 or '\\' in raw
                  or any(ord(char) < 32 or ord(char) == 127 for char in raw)):
              raise SystemExit('prepare_script is not a valid repository-relative path')
          relative = PurePosixPath(raw)
          if relative.is_absolute() or raw != relative.as_posix() or any(part in ('', '.', '..') for part in relative.parts):
              raise SystemExit('prepare_script must be a normalized repository-relative path')
          root = Path.cwd().resolve(strict=True)
          try:
              resolved = (root / Path(*relative.parts)).resolve(strict=True)
              resolved.relative_to(root)
          except (FileNotFoundError, RuntimeError, ValueError):
              raise SystemExit('prepare_script is missing or escapes the caller checkout')
          if not resolved.is_file():
              raise SystemExit('prepare_script must resolve to a regular file')
          print(resolved)
          PY
          )"
          for attempt in $(seq 1 "$PREPARE_ATTEMPTS"); do
            if bash -- "$script"; then
              exit 0
            fi
            if [ "$attempt" -eq "$PREPARE_ATTEMPTS" ]; then
              echo "::error::prepare_script failed after ${PREPARE_ATTEMPTS} attempt(s)"
              exit 1
            fi
            echo "::warning::prepare_script attempt ${attempt} failed; retrying"
            sleep "$((attempt * 5))"
          done
      - name: Prepare Android packages and manifest
        working-directory: caller
        shell: bash
        env:
          MOBENCH_CI_PREPARE: "1"
          FUNCTIONS_JSON: ${{ needs.validate-request.outputs.functions_android }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
          CRATE_PATH: ${{ inputs.crate_path }}
          HEAD_SHA: ${{ needs.validate-request.outputs.head_sha }}
          BUILD_RELEASE: ${{ inputs.build_release }}
          FFI_BACKEND: ${{ needs.validate-request.outputs.ffi_backend }}
        run: |
          set -euo pipefail
          release_args=()
          if [ "$BUILD_RELEASE" = true ]; then release_args+=(--release); fi
          backend_args=()
          if [ -n "$FFI_BACKEND" ]; then backend_args+=(--ffi-backend "$FFI_BACKEND"); fi
          cargo-mobench ci prepare --target android \
            --functions "$FUNCTIONS_JSON" --iterations "$ITERATIONS" --warmup "$WARMUP" \
            --crate-path "$CRATE_PATH" "${backend_args[@]}" "${release_args[@]}" --source-sha "$HEAD_SHA" \
            --output-dir target/mobench/prebuilt/android \
            --manifest target/mobench/prebuilt/android/manifest.json
      - name: Upload explicitly enumerated Android packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.artifact_prefix }}mobench-prebuilt-android
          path: |
            caller/target/mobench/prebuilt/android/manifest.json
            caller/target/mobench/prebuilt/android/entries/*/app.apk
            caller/target/mobench/prebuilt/android/entries/*/test.apk
          if-no-files-found: error
          retention-days: 1

  run-ios:
    name: Run prebuilt iOS packages on BrowserStack
    needs: [validate-request, trusted-mobench, prepare-ios]
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    environment: browserstack
    permissions:
      actions: read
      pull-requests: read
    steps:
      - name: Download trusted mobench
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}trusted-cargo-mobench
          path: trusted-bin
      - name: Download exact run-scoped iOS packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}mobench-prebuilt-ios
          path: prebuilt/ios
      - name: Revalidate current PR head before credential use
        if: inputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ needs.validate-request.outputs.head_sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if current="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Unable to revalidate the current PR head after 5 attempts"
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          current="$(printf '%s' "$current" | tr '[:upper:]' '[:lower:]')"
          test "$current" = "$EXPECTED_SHA" || { echo "::error::PR head changed before BrowserStack run"; exit 1; }
      - name: Resolve and validate iOS devices
        id: device
        shell: bash
        env:
          DEVICE_PROFILE: ${{ inputs.device_profile }}
          DEVICE_OVERRIDE: ${{ inputs.ios_device }}
          OS_OVERRIDE: ${{ inputs.ios_os_version }}
          STRUCTURED_DEVICES: ${{ needs.validate-request.outputs.ios_devices }}
        run: |
          set -euo pipefail
          chmod +x trusted-bin/cargo-mobench
          if [ -n "$STRUCTURED_DEVICES" ]; then
            specs="$(jq -cer '[.[] | .device + "-" + .os_version]' <<<"$STRUCTURED_DEVICES")"
          elif [ -n "$DEVICE_OVERRIDE" ] && [ -n "$OS_OVERRIDE" ]; then
            device="$DEVICE_OVERRIDE"; os="$OS_OVERRIDE"
            specs="$(jq -cn --arg spec "$device-$os" '[$spec]')"
          elif [ -n "$DEVICE_OVERRIDE" ] || [ -n "$OS_OVERRIDE" ]; then
            echo "::error::ios_device and ios_os_version must be provided together"
            exit 2
          else
            json="$(trusted-bin/cargo-mobench devices resolve --platform ios --profile "$DEVICE_PROFILE" --format json)"
            specs="$(jq -cer 'if (.devices | type) == "array" then [.devices[] | (.identifier // ((.device // .name) + "-" + .os_version))] else [(.identifier // ((.device // .name) + "-" + .os_version))] end' <<<"$json")"
          fi
          device_pattern='^[A-Za-z0-9._+()/ -]{1,100}$'
          os_pattern='^[A-Za-z0-9._+-]{1,32}$'
          count="$(jq -er 'length' <<<"$specs")"
          [ "$count" -ge 1 ] && [ "$count" -le 16 ] || exit 2
          while IFS= read -r spec; do
            device="${spec%-*}"; os="${spec##*-}"
            [[ "$device" =~ $device_pattern && "$os" =~ $os_pattern ]] || exit 2
          done < <(jq -er '.[]' <<<"$specs")
          [ "$(jq -er 'unique | length' <<<"$specs")" -eq "$count" ] || exit 2
          printf 'specs=%s\n' "$specs" >> "$GITHUB_OUTPUT"
      - name: Upload, run, and fetch iOS benchmark
        shell: bash
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          HEAD_SHA: ${{ needs.validate-request.outputs.head_sha }}
          DEVICE_SPECS: ${{ steps.device.outputs.specs }}
          FUNCTIONS_JSON: ${{ needs.validate-request.outputs.functions_ios }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP: ${{ inputs.warmup }}
          MAX_COMPLETION_TIMEOUT_SECS: ${{ inputs.max_completion_timeout_secs }}
        run: |
          set -euo pipefail
          device_args=()
          while IFS= read -r spec; do device_args+=(--devices "$spec"); done < <(jq -er '.[]' <<<"$DEVICE_SPECS")
          trusted-bin/cargo-mobench ci run-prebuilt \
            --manifest prebuilt/ios/manifest.json --expected-source-sha "$HEAD_SHA" \
            --expected-platform ios --expected-functions "$FUNCTIONS_JSON" \
            --expected-iterations "$ITERATIONS" --expected-warmup "$WARMUP" \
            --max-completion-timeout-secs "$MAX_COMPLETION_TIMEOUT_SECS" \
            "${device_args[@]}" --fetch --fetch-output-dir target/browserstack \
            --output-dir target/mobench/ci/ios
      - name: Upload iOS results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.artifact_prefix }}mobench-results-ios
          path: |
            target/mobench/ci/ios/summary.json
            target/mobench/ci/ios/summary.md
            target/mobench/ci/ios/results.csv
          if-no-files-found: warn
      - name: Upload collected iOS BrowserStack diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.artifact_prefix }}mobench-browserstack-ios
          path: |
            target/browserstack/**/*.json
            target/browserstack/**/*.log
            target/browserstack/**/*.txt
          if-no-files-found: warn

  run-android:
    name: Run prebuilt Android packages on BrowserStack
    needs: [validate-request, trusted-mobench, prepare-android, run-ios]
    if: >-
      always() &&
      (inputs.platform == 'android' || inputs.platform == 'both') &&
