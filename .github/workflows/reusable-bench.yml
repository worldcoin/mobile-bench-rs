  summarize:
    name: Sanitize and summarize benchmark results
    needs: [validate-request, trusted-mobench, run-ios, run-android]
    if: always() && (needs.run-ios.result == 'success' || needs.run-android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download trusted mobench
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}trusted-cargo-mobench
          path: trusted-bin
      - name: Download iOS results
        if: needs.run-ios.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}mobench-results-ios
          path: results/ios
      - name: Download Android results
        if: needs.run-android.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}mobench-results-android
          path: results/android
      - name: Reject unsafe report paths and fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          roots = [p for p in (Path('results/ios'), Path('results/android')) if p.exists()]
          allowed = {'summary.json', 'summary.md', 'results.csv'}
          unsafe = re.compile(r'[\x00-\x1f\x7f]|[<>`\[\]|!]|(?:^|\n)::')
          for root in roots:
              files = set()
              for p in root.rglob('*'):
                  if p.is_symlink() or (p.is_file() and p.stat().st_size > 50 * 1024 * 1024):
                      raise SystemExit('unsafe report artifact')
                  if p.is_file(): files.add(p.relative_to(root).as_posix())
              if files != allowed:
                  raise SystemExit('expected exactly summary.json, summary.md, and results.csv')
              payload = json.loads((root / 'summary.json').read_text())
              def check(v, depth=0):
                  if depth > 32: raise SystemExit('report nesting too deep')
                  if isinstance(v, str) and (len(v) > 4096 or unsafe.search(v)):
                      raise SystemExit('unsafe report field')
                  if isinstance(v, dict):
                      for k, x in v.items(): check(k, depth+1); check(x, depth+1)
                  elif isinstance(v, list):
                      for x in v: check(x, depth+1)
              check(payload)
          PY
      - name: Render trusted summaries
        shell: bash
        run: |
          set -euo pipefail
          chmod +x trusted-bin/cargo-mobench
          mkdir -p rendered
          for platform in ios android; do
            summary="results/$platform/summary.json"
            if [ -f "$summary" ]; then
              mkdir -p "rendered/$platform"
              trusted-bin/cargo-mobench report summarize --summary "$summary" \
                --output "rendered/$platform/summary.md" --plots off
            fi
          done
      - name: Write job summary
        shell: bash
        run: |
          set -euo pipefail
          for platform in ios android; do
            if [ -f "rendered/$platform/summary.md" ]; then
              printf '## %s Benchmark Results\n\n' "${platform^}" >> "$GITHUB_STEP_SUMMARY"
              cat "rendered/$platform/summary.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Build history bundle
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ needs.validate-request.outputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          set -euo pipefail
          mkdir -p history-bundle
          platforms='[]'
          for platform in ios android; do
            source="results/$platform/summary.json"
            [ -f "$source" ] || continue
            mkdir -p "history-bundle/$platform"
            cp "$source" "history-bundle/$platform/summary.json"
            csv="results/$platform/results.csv"
            [ ! -f "$csv" ] || cp "$csv" "history-bundle/$platform/results.csv"
            platforms="$(jq --arg p "$platform" '. + [$p]' <<<"$platforms")"
          done
          jq -n --arg sha "$HEAD_SHA" --arg pr "$PR_NUMBER" --arg by "$REQUESTED_BY" \
            --argjson platforms "$platforms" \
            '{schema_version:"mobench-history-v1",commit_sha:$sha,pr_number:(if $pr == "" then null else ($pr|tonumber) end),requested_by:$by,platforms:$platforms}' \
            > history-bundle/manifest.json
      - name: Upload sanitized report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.artifact_prefix }}mobench-sanitized-report
          path: |
            rendered/ios/summary.md
            rendered/android/summary.md
            results/ios/**/summary.json
            results/android/**/summary.json
          if-no-files-found: error
      - name: Upload history bundle
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.artifact_prefix }}mobench-history-bundle
          path: |
            history-bundle/manifest.json
            history-bundle/ios/summary.json
            history-bundle/ios/results.csv
            history-bundle/android/summary.json
            history-bundle/android/results.csv
          if-no-files-found: warn

  report:
    name: Publish PR and check-run reports
    needs: [validate-request, trusted-mobench, summarize]
    # `always()` prevents an intentionally skipped platform from propagating
    # GitHub's implicit success guard into this single-platform report job.
    if: always() && inputs.pr_number != '' && needs.summarize.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      checks: write
    steps:
      - name: Download trusted mobench
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}trusted-cargo-mobench
          path: trusted-bin
      - name: Download sanitized report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_prefix }}mobench-sanitized-report
          path: report
      - name: Publish sticky PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- mobench-summary -->'
          body_file="$(mktemp)"
          {
            printf '%s\n## Mobench Benchmark Results\n\n' "$marker"
            for platform in ios android; do
              summary="report/rendered/$platform/summary.md"
              if [ -f "$summary" ]; then
                printf '## %s Benchmark Results\n\n' "${platform^}"
                cat "$summary"
                printf '\n'
              fi
            done
          } > "$body_file"
          jq -n --rawfile body "$body_file" '{body:$body}' > request.json
          existing="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -1)"
          if [ -n "$existing" ]; then
            gh api "repos/${REPO}/issues/comments/${existing}" -X PATCH --input request.json --silent
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -X POST --input request.json --silent
          fi
      - name: Create threshold-aware check runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.validate-request.outputs.head_sha }}
          CHECK_NAME: ${{ inputs.check_run_name }}
          REGRESSION_THRESHOLD: ${{ inputs.regression_threshold_pct }}
          CRATE_PATH: ${{ inputs.crate_path }}
        run: |
          set -euo pipefail
          chmod +x trusted-bin/cargo-mobench
          [[ "$REGRESSION_THRESHOLD" =~ ^[0-9]+([.][0-9]+)?$ ]] || exit 2
          [[ "$CRATE_PATH" != /* && "$CRATE_PATH" != *..* && "$CRATE_PATH" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 2
          for platform in ios android; do
            results="report/results/$platform"
            [ -d "$results" ] || continue
            trusted-bin/cargo-mobench ci check-run \
              --results-dir "$results" --repo "$REPO" --sha "$HEAD_SHA" \
              --name "$CHECK_NAME — $platform" \
              --annotation-path "$CRATE_PATH/src/lib.rs" \
              --regression-threshold-pct "$REGRESSION_THRESHOLD"
          done
